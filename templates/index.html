<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zepto Support Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-wrapper">
        <div class="chat-container">
            <!-- Header -->
            <header class="chat-header">
                <div class="brand-group">
                    <div class="brand-avatar">
                        <span class="bolt">⚡</span>
                    </div>
                    <div class="brand-info">
                        <div class="brand-title-row">
                            <h2>Zepto Support</h2>
                            <span class="badge-pill">AI Assistant</span>
                        </div>
                        <p class="brand-status">
                            <span class="status-dot"></span>
                            Online &bull; 10-Min Delivery Helpdesk
                        </p>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="clear-btn" class="icon-btn" title="Clear Conversation" onclick="clearChat()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Stream -->
            <main id="chat-box" class="chat-box">
                <!-- Welcome Card -->
                <div class="welcome-card" id="welcome-card">
                    <div class="welcome-icon">⚡</div>
                    <h3>Welcome to Zepto Customer Care</h3>
                    <p>Ask anything about your deliveries, cancellations, returns, refunds, or membership benefits.</p>
                    <div class="quick-prompts-title">Frequently Asked Questions</div>
                    <div class="quick-chips">
                        <button class="chip" onclick="handleQuickPrompt('What is the delivery time?')">
                            ⏱️ What is the delivery time?
                        </button>
                        <button class="chip" onclick="handleQuickPrompt('How do I track my active order?')">
                            📦 How do I track my order?
                        </button>
                        <button class="chip" onclick="handleQuickPrompt('Can I get a refund for a damaged or missing item?')">
                            💰 Can I get a refund for damaged items?
                        </button>
                        <button class="chip" onclick="handleQuickPrompt('Can I cancel my order after checkout?')">
                            ❌ Can I cancel an order?
                        </button>
                        <button class="chip" onclick="handleQuickPrompt('What are your customer support hours?')">
                            🕒 What are customer support hours?
                        </button>
                        <button class="chip" onclick="handleQuickPrompt('What are the benefits of membership tiers?')">
                            ⭐ What are the membership benefits?
                        </button>
                    </div>
                </div>
            </main>

            <!-- Footer / Input Area -->
            <footer class="chat-footer">
                <div class="input-container">
                    <input
                        type="text"
                        id="question"
                        placeholder="Type your question here..."
                        autocomplete="off"
                    >
                    <button id="send-btn" class="send-btn" onclick="askQuestion()" title="Send Message">
                        <span>Send</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="footer-hint">
                    Powered by Kie.ai &bull; Zepto Support AI Assistant
                </div>
            </footer>
        </div>
    </div>

    <script>
        const input = document.getElementById("question");
        const chatBox = document.getElementById("chat-box");
        const btn = document.getElementById("send-btn");
        const welcomeCard = document.getElementById("welcome-card");

        function getTimeString() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        function renderMarkdown(content) {
            if (typeof marked !== "undefined" && marked.parse) {
                try {
                    return marked.parse(content);
                } catch (e) {
                    console.warn("Markdown parse error:", e);
                }
            }
            // Fallback lightweight formatter
            let html = escapeHtml(content);
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function handleQuickPrompt(text) {
            input.value = text;
            askQuestion();
        }

        function clearChat() {
            chatBox.innerHTML = "";
            if (welcomeCard) {
                chatBox.appendChild(welcomeCard);
            }
            input.value = "";
            input.focus();
        }

        async function askQuestion() {
            const question = input.value.trim();
            if (!question) return;

            // Hide welcome card if present
            if (welcomeCard && welcomeCard.parentElement === chatBox) {
                welcomeCard.remove();
            }

            // Lock input while request is pending
            btn.disabled = true;
            input.disabled = true;

            // Append user message bubble
            const time = getTimeString();
            const userMsgEl = document.createElement("div");
            userMsgEl.className = "message-row user-row";
            userMsgEl.innerHTML = `
                <div class="message-bubble user-bubble">
                    <div class="bubble-content">${escapeHtml(question)}</div>
                    <div class="message-meta">${time}</div>
                </div>
                <div class="avatar user-avatar">👤</div>
            `;
            chatBox.appendChild(userMsgEl);
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Append typing indicator bubble
            const loadingRow = document.createElement("div");
            loadingRow.className = "message-row bot-row";
            loadingRow.id = "bot-loading";
            loadingRow.innerHTML = `
                <div class="avatar bot-avatar">⚡</div>
                <div class="message-bubble bot-bubble loading-bubble">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatBox.appendChild(loadingRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json().catch(() => ({}));
                const responseText = data.answer || data.error || (response.ok ? "No response received." : `Server error (${response.status})`);

                // Replace loading bubble with formatted bot answer
                loadingRow.innerHTML = `
                    <div class="avatar bot-avatar">⚡</div>
                    <div class="message-bubble bot-bubble">
                        <div class="bubble-content markdown-body">${renderMarkdown(responseText)}</div>
                        <div class="message-meta">${getTimeString()}</div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                loadingRow.innerHTML = `
                    <div class="avatar bot-avatar">⚡</div>
                    <div class="message-bubble bot-bubble error-bubble">
                        <div class="bubble-content">
                            <strong>Notice:</strong> ${escapeHtml(error.message || "Failed to reach server. Please check your connection.")}
                        </div>
                        <div class="message-meta">${getTimeString()}</div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
                console.error(error);
            } finally {
                btn.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        // Enter key to send
        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                askQuestion();
            }
        });

        // Focus input on page load
        window.addEventListener("DOMContentLoaded", () => {
            input.focus();
        });
    </script>
</body>
</html>
